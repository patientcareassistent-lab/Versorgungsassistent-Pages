<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konfiguration Prothetik uEx · UKB</title>
<style>
:root{--navy:#17366b;--cyan:#e9f4fa;--line:#c9d9e5;--bg:#f3f7fb;--text:#183048}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}header{background:#fff;border-bottom:3px solid var(--navy);padding:16px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{font-size:21px;color:var(--navy);font-weight:750}.brand small{display:block;font-size:12px;font-weight:500;color:#567}.pill{border:1px solid #bfcedb;border-radius:20px;padding:6px 12px;font-size:12px}main{display:grid;grid-template-columns:205px minmax(0,1fr);gap:14px;margin:16px auto;padding:0 10px;max-width:1220px}nav,.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px #17366b0a}nav{padding:12px;align-self:start}nav button{width:100%;text-align:left;background:transparent;border:0;padding:12px 9px;color:var(--text);cursor:pointer;border-radius:8px;font-size:13px}nav button.active{background:#e7f0fa;color:var(--navy);font-weight:750}nav button:hover{background:#f2f6fa}nav .muted{font-size:12px;color:#718397;padding:9px}.panel{padding:21px;min-height:490px}h1{font-size:22px;margin:0 0 6px;color:var(--navy)}h2{font-size:17px;margin:0 0 12px;color:var(--navy)}.sub{color:#5f7288;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}input,select,textarea{width:100%;min-width:0;border:1px solid #b9cbdc;border-radius:7px;padding:10px;background:#fff;font:inherit;color:inherit}textarea{min-height:75px}.field{margin-bottom:14px}.section{background:#f8fbfe;border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:17px}.item{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(120px,.75fr) 82px;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #e2ebf0}.item:last-child{border:0}.item input[type=checkbox]{width:18px;height:18px}.item .name{font-weight:600;font-size:14px}.item .details{font-size:11px;color:#667e92}.item input[type=text],.item input[type=number]{padding:8px}.warning{border-left:4px solid #bc7612;padding:10px 13px;background:#fff8e7;margin:12px 0;font-size:13px}.info{border-left:4px solid #28719a;padding:10px 13px;background:#eef7fd;margin:12px 0;font-size:13px}.context-line{display:flex;flex-wrap:wrap;gap:12px 22px;font-size:13px}.context-line span{color:#5f7288;margin-right:5px}.readonly{color:#193c67}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}button.action{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}button.secondary{background:#fff;color:var(--navy);border:1px solid #9eafc1;border-radius:8px;padding:10px 15px;cursor:pointer}.summary{width:100%;border-collapse:collapse;font-size:13px}.summary th,.summary td{text-align:left;border-bottom:1px solid var(--line);padding:9px}.summary th{background:#edf4fa}footer{padding:0 18px 16px;color:#738496;font-size:12px}@media(max-width:780px){main{display:block}nav{display:flex;overflow:auto;gap:4px;margin-bottom:12px}nav button{min-width:max-content;width:auto}.panel{padding:15px}.grid{grid-template-columns:1fr}.item{grid-template-columns:26px 1fr}.item input[type=text],.item input[type=number]{grid-column:2}}@media print{header,nav,.toolbar,footer,.no-print{display:none!important}main{display:block;margin:0;padding:0}.panel{border:0;box-shadow:none;padding:0}.section{break-inside:avoid}body{background:white}}
</style></head><body><header><div class="brand">◯ Prothetik uEx <small>UKB · Konfiguration nach Maßblatt · Version 0.2</small></div><span class="pill">Datenübernahme nur im Browser</span></header><main><nav id="nav"></nav><section class="panel"><div id="view"></div><div class="toolbar"><button type="button" class="secondary" id="back">Zurück</button><div><button type="button" class="secondary" id="reset">Zurücksetzen</button> <button type="button" class="action" id="next">Weiter</button></div></div></section></main><footer>Vorläufige technische Planung nach UKB-Konfigurationsbogen (18.08.2026). Keine automatische Vertragsfreigabe. Grunddaten werden hier nicht gespeichert.</footer>
<script>
'use strict';
const steps=['Versorgung & Aufbau','Schaft','Haltesysteme','Fußpassteile','Bauteile','Kosmetik & Zubehör','Zusammenfassung'];
const descriptions=['Bauweise, Schaftrand und Einsatzbereich bestimmen. Grunddaten werden nicht erneut erfasst.','Schaftausführung und Schaftrand.','Schaftanbindung, Halte- und Verschlusssysteme.','Fußpassteile auswählen.','Adapter und weitere Bauteile erfassen.','Kosmetik und Zubehör ergänzen.','Technische Konfiguration und Prüfhinweise.'];
const groups={
 Schaft:['Verstellbarer Schaft','Weichwandschaft','Silikon-Kontaktschaft','Flexible Randgestaltung','Flexibler Innenschaft'],
 Haltesysteme:['Liner individuell','Liner konfektioniert','Pin-/Lock','Klett-/Gurt','Seilzug-/Kordel','Einhand-Seilzug','Sonstiger Verschluss','Oberschenkelhülse Leder','Oberschenkelhülse Kunststoff','Adaptive Schienen'],
 Fußpassteile:['Monoaxial','Multiaxial','Autoadaptiv','Mechatronisch','Keine Dynamik','Mittlere Dynamik','Hohe Dynamik'],
 Bauteile:['Ventil','Schaftansatz/-platte','Eingussanker','Schraub-Adapter','Rohr-Adapter','Fuß-Adapter','Doppel-Adapter','Anschluss-Adapter','Extender-Adapter','Exzenter-Adapter','Anprobe-Adapter','Schalen-Adapter','Dreh-Adapter','Rotations-Adapter','Knöchel-Adapter','Sonstiger Adapter','Stoßdämpfer'],
 Kosmetik:['Schaftgestaltung','Verkleidung Strumpf','Verkleidung individuell','Individueller Formausgleich','Superskin einteilig'],
 Zubehör:['Kniekappe','Stumpfstrumpf','Stumpfkissen konfektioniert','Stumpfkissen individuell','Anziehhilfe']
};
const emptyState=()=>({versorgung:{},parts:{},notes:'',abgeschlossen:false});
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const allowedContext=['versorgungshoehe','seite','phase','kostentraeger','mobilitaetsgrad','gewicht_kg'];
const labels={versorgungshoehe:'Versorgungshöhe',seite:'Seite',phase:'Versorgungsphase',kostentraeger:'Kostenträger',mobilitaetsgrad:'Mobilitätsgrad',gewicht_kg:'Gewicht (kg)'};
let state=emptyState(),step=0,kontext=null,readOnly=false;
const listeners=new Set();
function serialize(){return {schema:'uex-konfiguration-0.2',versorgung:{...state.versorgung},bauteile:Object.fromEntries(Object.entries(state.parts).filter(([,p])=>p.enabled).map(([name,p])=>[name,{artikelnummer:p.article||'',menge:Math.max(1,Number(p.count)||1)}])),begruendung:state.notes,abgeschlossen:state.abgeschlossen===true};}
function notify(){if(readOnly)return;const data=serialize();for(const callback of listeners){try{callback(data)}catch(error){console.error('Konfiguration konnte nicht übergeben werden',error)}}}
function field(key,label,type='text',opts=[]){const val=state.versorgung[key]??'';return '<div class="field"><label for="'+key+'">'+label+'</label>'+(type==='select'?'<select id="'+key+'" data-key="'+key+'"><option value="">Bitte auswählen</option>'+opts.map(o=>'<option value="'+e(o)+'" '+(val===o?'selected':'')+'>'+e(o)+'</option>').join('')+'</select>':'<input id="'+key+'" data-key="'+key+'" type="'+type+'" value="'+e(val)+'">')+'</div>';}
function contextView(){if(!kontext)return '<div class="info">Standalone ohne Fallzuordnung · UKB. Für die Einbindung werden die notwendigen Angaben aus dem Versorgungsvorgang übergeben.</div>';return '<div class="section"><h2>Versorgungskontext · schreibgeschützt</h2><div class="context-line">'+allowedContext.filter(k=>kontext[k]).map(k=>'<div><span>'+labels[k]+':</span><strong class="readonly">'+e(kontext[k])+'</strong></div>').join('')+'</div></div>';}
function rows(group){return '<div class="section"><h2>'+group+'</h2>'+groups[group].map(name=>{const p=state.parts[name]||{};return '<div class="item"><input type="checkbox" data-part="'+e(name)+'" '+(p.enabled?'checked':'')+' aria-label="'+e(name)+' auswählen"><div><div class="name">'+e(name)+'</div><div class="details">Artikel / Zusatzposition</div></div><input type="text" placeholder="Artikelnummer / Hersteller" data-article="'+e(name)+'" aria-label="Artikelnummer '+e(name)+'" value="'+e(p.article)+'" '+(p.enabled?'':'disabled')+'><input type="number" data-count="'+e(name)+'" aria-label="Menge '+e(name)+'" min="1" value="'+(p.count||1)+'" '+(p.enabled?'':'disabled')+'></div>';}).join('')+'</div>';}
function issues(){const out=[],v=state.versorgung,k=kontext||{};if(!v.bauweise)out.push('Bauweise nicht ausgewählt.');if(!v.schaftrand)out.push('Schaftrand nicht ausgewählt.');if(!v.zweck)out.push('Einsatzbereich nicht ausgewählt.');if(k.phase==='Interim'&&v.zweck==='Wasserfest'&&/AOK Baden/i.test(k.kostentraeger||''))out.push('Wasserfeste Interimsversorgung ist für AOK Baden-Württemberg nicht vorgesehen.');if(v.zweck==='Wasserfest'&&state.parts['Mechatronisch']?.enabled)out.push('Mechatronische Fußpassteile bei wasserfester Versorgung fachlich und vertraglich prüfen.');if(k.versorgungshoehe&&!['Unterschenkel','UKB','Unterschenkelprothese'].includes(k.versorgungshoehe))out.push('Dieser Konfigurator gilt nur für UKB.');for(const [name,p] of Object.entries(state.parts))if(p.enabled&&!String(p.article||'').trim())out.push('Artikelnummer bitte prüfen: '+name+'.');return out;}
function save(){document.querySelectorAll('[data-key]').forEach(el=>{state.versorgung[el.dataset.key]=el.value});if($('notes'))state.notes=$('notes').value;}
function go(i){save();notify();step=Math.max(0,Math.min(steps.length-1,i));render();}
function invalidateCompletion(){
 if(!state.abgeschlossen)return;
 state.abgeschlossen=false;
 if(step===steps.length-1){$('next').textContent='Fertig';$('next').disabled=readOnly;}
}
function finish(){
 if(readOnly||state.abgeschlossen)return;
 save();
 const missing=[];
 if(!state.versorgung.bauweise)missing.push('Bauweise');
 if(!state.versorgung.schaftrand)missing.push('Schaftrand');
 if(!state.versorgung.zweck)missing.push('Einsatzbereich');
 if(!Object.values(state.parts).some(part=>part.enabled))missing.push('mindestens eine Komponente');
 if(missing.length){
   const notice=$('finishNotice');
   if(notice){notice.hidden=false;notice.textContent='Konfiguration noch nicht abschließbar: '+missing.join(' · ');}
   return;
 }
 state.abgeschlossen=true;
 notify();
 render();
}
function downloadJson(){save();const blob=new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prothesenkonfiguration-uex.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function render(){
 let html='<h1>'+steps[step]+'</h1><p class="sub">'+descriptions[step]+'</p>';
 if(step===0)html+=contextView()+'<div class="grid">'+field('bauweise','Bauweise','select',['Modularbauweise','Schalenbauweise'])+field('schaftrand','Schaftrand','select',['Kniespaltübergreifend','Kondylenübergreifend'])+field('zweck','Einsatzbereich','select',['Alltag','Wasserfest'])+'</div><div class="section"><h2>Besondere Versorgungssituationen</h2><div class="grid">'+field('besonderheit','Konfigurationsanlass','select',['Regelversorgung','Verlängerung Interimsphase','Zusätzlicher Testschaft','Folgeschaft','Übernahme Bauteile aus Interim'])+field('grund','Fachliche Begründung')+'</div></div>';
 if(step===1)html+=rows('Schaft');if(step===2)html+=rows('Haltesysteme');if(step===3)html+=rows('Fußpassteile');if(step===4)html+=rows('Bauteile');if(step===5)html+=rows('Kosmetik')+rows('Zubehör');
 if(step===6){const entries=Object.entries(state.parts).filter(([,p])=>p.enabled);html+=contextView()+'<div class="section"><h2>Technische Konfiguration</h2><div class="grid">'+Object.entries(state.versorgung).filter(([,v])=>v).map(([k,v])=>'<div><strong>'+e(k)+'</strong>: '+e(v)+'</div>').join('')+'</div></div>';html+='<div class="section"><h2>Konfigurierte Komponenten ('+entries.length+')</h2><table class="summary"><thead><tr><th>Komponente</th><th>Artikelnummer</th><th>Menge</th></tr></thead><tbody>'+entries.map(([name,p])=>'<tr><td>'+e(name)+'</td><td>'+e(p.article||'–')+'</td><td>'+e(p.count||1)+'</td></tr>').join('')+'</tbody></table></div>';html+='<div class="section"><h2>Prüfhinweise</h2>'+(issues().map(msg=>'<div class="warning">'+e(msg)+'</div>').join('')||'<div class="info">Grundangaben vorhanden; technische und vertragliche Freigabe erfolgt weiterhin fachlich.</div>')+'<div class="info">SIC-Musternummern werden noch nicht automatisch vergeben. Diese Fassung enthält keine bestätigte Vertragsmatrix.</div></div><div class="field"><label for="notes">Freitext / fachliche Begründung</label><textarea id="notes">'+e(state.notes)+'</textarea></div><button type="button" class="action no-print" id="print">Als PDF drucken</button> <button type="button" class="secondary no-print" id="json">Technischen JSON-Export erstellen</button>';}
 if(step===steps.length-1)html+='<div id="finishNotice" class="warning" role="alert" hidden></div>';
 $('view').innerHTML=html;$('nav').innerHTML='<div class="muted">Konfigurationsschritte</div>'+steps.map((x,i)=>'<button type="button" data-step="'+i+'" class="'+(step===i?'active':'')+'">'+(i+1)+'. '+x+'</button>').join('');$('back').style.visibility=step===0?'hidden':'visible';$('next').textContent=step===steps.length-1?(state.abgeschlossen?'Abgeschlossen':'Fertig'):'Weiter';
 $('next').disabled=readOnly||(step===steps.length-1&&state.abgeschlossen);
 $('next').setAttribute('aria-label',step===steps.length-1&&state.abgeschlossen?'Konfiguration abgeschlossen':$('next').textContent);
 document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{invalidateCompletion();state.versorgung[el.dataset.key]=el.value;notify()}));
 document.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('change',()=>{const p=state.parts[el.dataset.part]||(state.parts[el.dataset.part]={count:1});p.enabled=el.checked;invalidateCompletion();notify();render()}));
 document.querySelectorAll('[data-article]').forEach(el=>el.addEventListener('input',()=>{const p=state.parts[el.dataset.article]||(state.parts[el.dataset.article]={count:1});p.article=el.value;invalidateCompletion();notify()}));
 document.querySelectorAll('[data-count]').forEach(el=>el.addEventListener('change',()=>{const p=state.parts[el.dataset.count]||(state.parts[el.dataset.count]={count:1});p.count=Math.max(1,Number(el.value)||1);invalidateCompletion();notify()}));
 document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>go(Number(el.dataset.step)));
 if($('notes'))$('notes').oninput=()=>{state.notes=$('notes').value;invalidateCompletion();notify()};
 if($('json'))$('json').onclick=downloadJson;
 if($('print'))$('print').onclick=()=>{save();window.print()};
 if(readOnly){document.querySelectorAll('input,select,textarea,button').forEach(el=>{if(el.id!=='print'&&!el.dataset.step)el.disabled=true;});$('reset').disabled=true;}
}
window.ProthetikUEX={
 setKontext(d){if(!d||typeof d!=='object')throw new TypeError('Kontext muss Objekt sein');kontext=Object.freeze(Object.fromEntries(allowedContext.filter(k=>d[k]!=null).map(k=>[k,String(d[k]).slice(0,140)])));render()},
 getKonfiguration(){save();return serialize()},
 setKonfiguration(d){if(d!=null && (typeof d!=='object'||d.schema!=='uex-konfiguration-0.2'))throw new TypeError('Unbekannte Konfiguration');state=emptyState();if(d){for(const k of ['bauweise','schaftrand','zweck','besonderheit','grund'])if(d.versorgung&&typeof d.versorgung[k]==='string')state.versorgung[k]=d.versorgung[k].slice(0,2000);for(const [name,p] of Object.entries(d.bauteile||{})){if(!Object.values(groups).some(list=>list.includes(name))||!p||typeof p!=='object')continue;state.parts[name]={enabled:true,article:String(p.artikelnummer||'').slice(0,250),count:Math.max(1,Math.min(1000,Number(p.menge)||1))};}state.notes=String(d.begruendung||'').slice(0,10000);state.abgeschlossen=d.abgeschlossen===true}step=0;render()},
 onChange(callback){if(typeof callback!=='function')throw new TypeError('Callback erforderlich');listeners.add(callback);return ()=>listeners.delete(callback)},
 setReadOnly(flag){readOnly=!!flag;render()},
 getKontext(){return kontext?{...kontext}:null},
 clearKontext(){kontext=null;render()}
};
$('back').onclick=()=>go(step-1);$('next').onclick=()=>{if(step===steps.length-1)finish();else go(step+1);};
$('reset').onclick=()=>{if(!readOnly && confirm('Technische Konfiguration zurücksetzen?')){state=emptyState();step=0;notify();render();}};
render();
</script></body></html>
