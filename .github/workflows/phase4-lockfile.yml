name: Phase 4 lockfile update

on:
  push:
    branches:
      - hardening/phase4-browser-regression
    paths:
      - '.github/workflows/phase4-lockfile.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/phase4-browser-regression
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh dependency lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (lock.lockfileVersion !== 3) throw new Error('Expected npm lockfileVersion 3')
          if (lock.packages?.['node_modules/@playwright/test']?.version !== pkg.devDependencies['@playwright/test']) {
            throw new Error('Playwright version is not pinned in package-lock.json')
          }
          console.log('Playwright dependency lock verified.')
          NODE

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "patientcareassistent-lab"
          git config user.email "patientcare.assistent@gmail.com"
          git add package.json package-lock.json
          git rm .github/workflows/phase4-lockfile.yml
          git commit -m "Lock Playwright regression dependency graph"
          git push origin HEAD:hardening/phase4-browser-regression
