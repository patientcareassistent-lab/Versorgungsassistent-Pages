name: Generate dependency lockfile once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfile.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'))
          if (lock.lockfileVersion !== 3) throw new Error('Expected lockfileVersion 3')
          for (const [name, version] of Object.entries(pkg.dependencies || {})) {
            if (!/^\d+\.\d+\.\d+/.test(version)) throw new Error(`Dependency ${name} is not exact: ${version}`)
          }
          console.log('Dependency lockfile generated and exact top-level versions verified.')
          NODE

      - name: Commit lockfile and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "patientcareassistent-lab"
          git config user.email "patientcare.assistent@gmail.com"
          git add package.json package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "Lock production browser dependency graph"
          git push origin HEAD:main
