name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'projektportal/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # New commits supersede older deployments. 'Cancelled' is expected in this case;
  # only the newest workflow run must complete successfully.
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Production safety gate
        shell: bash
        run: |
          set -euo pipefail
          runtime_files=(index.html app.js frame-guard.js whispercpp/runtime.js whispercpp/worker.js)
          if grep -niE 'service[_-]?role|sb_secret_|/mnt/data|file://|localhost|127\.0\.0\.1' "${runtime_files[@]}"; then
            echo 'Production safety gate failed: secret-like credential or local-only runtime dependency found.'
            exit 1
          fi
          if ! grep -q 'sb_publishable_' index.html app.js; then
            echo 'Production safety gate failed: expected Supabase publishable key marker not found.'
            exit 1
          fi
          echo 'Production safety gate passed.'


      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Fetch current AOK PG24 source forms
        shell: bash
        run: |
          set -e
          mkdir -p assets/aok-pg24
          python3 - <<'PY'
          import html, os, re, urllib.parse, urllib.request
          page='https://www.aok.de/gp/orthopaedie-rehatechnik/vertraege/pg24-beinprothesen'
          req=urllib.request.Request(page+'?stand=20260901',headers={'User-Agent':'Mozilla/5.0'})
          try:
              raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          except Exception as e:
              print('AOK page fetch failed:',e); raise SystemExit(1)
          anchors=re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S)
          wanted={
            'Anlage 4':'anlage-4-profilerhebungsbogen.pdf',
            'Anlage 5a':'anlage-5a-fuss.pdf',
            'Anlage 5b':'anlage-5b-ukb.pdf',
            'Anlage 5c':'anlage-5c-knieex.pdf',
            'Anlage 5d':'anlage-5d-okb.pdf',
            'Anlage 5e':'anlage-5e-hueftex.pdf',
          }
          found={}
          for href,labelhtml in anchors:
              label=html.unescape(re.sub('<[^>]+>',' ',labelhtml))
              label=' '.join(label.split())
              for needle,target in wanted.items():
                  if needle.lower() in label.lower() and target not in found:
                      url=urllib.parse.urljoin(page,html.unescape(href))
                      if '.pdf' in url.lower():
                          found[target]=url
          print('AOK PG24 assets found:',sorted(found))
          missing=[target for target in wanted.values() if target not in found]
          if missing:
              raise SystemExit('Missing AOK PG24 assets: '+', '.join(missing))
          for target,url in found.items():
              try:
                  out=os.path.join('assets/aok-pg24',target)
                  r=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':page})
                  data=urllib.request.urlopen(r,timeout=60).read()
                  if data[:4]==b'%PDF':
                      open(out,'wb').write(data)
                      print('downloaded',target,len(data))
              except Exception as e:
                  print('download failed',target,e)
                  raise
          PY

      - name: Setup pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build locked browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor node_modules
          mkdir -p vendor/tesseract/core vendor/tesseract/lang vendor/pdfjs

          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=critical

          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js vendor/supabase.js
          cp node_modules/tesseract.js/dist/tesseract.esm.min.js vendor/tesseract/tesseract.esm.min.js
          cp node_modules/tesseract.js/dist/worker.min.js vendor/tesseract/worker.min.js
          cp node_modules/tesseract.js-core/tesseract-core* vendor/tesseract/core/

          LANG_FILE="$(find node_modules/@tesseract.js-data/deu -type f -name 'deu.traineddata.gz' -print -quit)"
          test -n "$LANG_FILE"
          cp "$LANG_FILE" vendor/tesseract/lang/deu.traineddata.gz

          cp node_modules/pdfjs-dist/build/pdf.min.mjs vendor/pdfjs/pdf.min.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs vendor/pdfjs/pdf.worker.min.mjs

          test -s vendor/supabase.js
          test -s vendor/tesseract/tesseract.esm.min.js
          test -s vendor/tesseract/worker.min.js
          test -s vendor/tesseract/lang/deu.traineddata.gz
          test -s vendor/pdfjs/pdf.min.mjs
          test -s vendor/pdfjs/pdf.worker.min.mjs

          find vendor -type f -print0 | sort -z | xargs -0 sha256sum > vendor/SHA256SUMS

      - name: Validate Supabase archive security invariants
        run: npm run test:security

      # Cached only when the pinned Whisper revision and local WASM sources match.
      # Browser regression and security gates still run on every deployment.
      - name: Restore pinned whisper.cpp release assets
        id: whisper-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            whispercpp/whisper.js
            whispercpp/ggml-tiny-q5_1.bin
            whispercpp/UPSTREAM_REVISION
            whispercpp/MODEL_SHA256
            whispercpp/RUNTIME_SHA256
          key: ${{ runner.os }}-whisper-d1be6fde-tiny-q5-v1-${{ hashFiles('whispercpp/emscripten.cpp', 'whispercpp/CMakeLists.txt', 'whispercpp/runtime.js', 'whispercpp/worker.js') }}

      - name: Setup pinned Emscripten toolchain
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021

      - name: Build pinned single-thread whisper.cpp WebAssembly
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_CPP_REV="d1be6fde11ac6e0407606b4e42fe72d34add8037"
          rm -rf .whisper-src .whisper-build
          git clone --quiet https://github.com/ggml-org/whisper.cpp.git .whisper-src
          git -C .whisper-src checkout --quiet "$WHISPER_CPP_REV"

          cp whispercpp/emscripten.cpp .whisper-src/examples/whisper.wasm/emscripten.cpp
          cp whispercpp/CMakeLists.txt .whisper-src/examples/whisper.wasm/CMakeLists.txt

          emcmake cmake -S .whisper-src -B .whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_WASM_SINGLE_FILE=ON
          cmake --build .whisper-build --target libmain --parallel 2

          cp .whisper-build/bin/libmain.js whispercpp/whisper.js
          test -s whispercpp/whisper.js
          grep -q "whisper_factory" whispercpp/whisper.js
          printf '%s\n' "$WHISPER_CPP_REV" > whispercpp/UPSTREAM_REVISION

          rm -rf .whisper-src .whisper-build

      - name: Fetch pinned multilingual whisper.cpp model
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$MODEL_URL" \
            --output whispercpp/ggml-tiny-q5_1.bin

          test -s whispercpp/ggml-tiny-q5_1.bin
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  whispercpp/ggml-tiny-q5_1.bin" | sha256sum -c -

          sha256sum whispercpp/ggml-tiny-q5_1.bin > whispercpp/MODEL_SHA256
          sha256sum whispercpp/whisper.js whispercpp/runtime.js whispercpp/worker.js > whispercpp/RUNTIME_SHA256

      - name: Verify cached or newly built Whisper assets
        shell: bash
        run: |
          set -euo pipefail
          test -s whispercpp/whisper.js
          grep -q "whisper_factory" whispercpp/whisper.js
          test "$(cat whispercpp/UPSTREAM_REVISION)" = "d1be6fde11ac6e0407606b4e42fe72d34add8037"
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  whispercpp/ggml-tiny-q5_1.bin" | sha256sum -c -
          sha256sum -c whispercpp/MODEL_SHA256
          sha256sum -c whispercpp/RUNTIME_SHA256
          sha256sum package-lock.json > DEPENDENCY_LOCK_SHA256

      - name: Runtime dependency gate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check whispercpp/runtime.js
          node --check whispercpp/worker.js
          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys

          runtime_files = [
              Path('index.html'),
              Path('app.js'),
              Path('frame-guard.js'),
              Path('whispercpp/runtime.js'),
              Path('whispercpp/worker.js'),
          ]
          failures = []
          checks = [
              ('remote dynamic import', re.compile(r'''import\s*\(\s*["']https://''', re.I)),
              ('remote static import', re.compile(r'''from\s*["']https://''', re.I)),
              ('remote script source', re.compile(r'''<script\b[^>]*\bsrc\s*=\s*["']https://''', re.I)),
          ]

          for path in runtime_files:
              source = path.read_text(encoding='utf-8')
              for label, pattern in checks:
                  if pattern.search(source):
                      failures.append(f'{path}: {label}')
              if 'huggingface.co' in source.lower() or 'hf.co' in source.lower():
                  failures.append(f'{path}: runtime Hugging Face access remains')

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          cpp = Path('whispercpp/emscripten.cpp').read_text(encoding='utf-8')
          cmake = Path('whispercpp/CMakeLists.txt').read_text(encoding='utf-8')
          pkg = json.loads(Path('package.json').read_text(encoding='utf-8'))

          if re.search(r'''<script\b(?![^>]*\bsrc\s*=)[^>]*>''', html, re.I):
              failures.append('index.html: inline script block')
          if re.search(r'<style\b', html, re.I):
              failures.append('index.html: inline style block')
          if re.search(r'\sstyle\s*=', html, re.I):
              failures.append('index.html: inline style attribute')
          if re.search(r'''\.style\b|setAttribute\(\s*["']style["']|cssText''', app):
              failures.append('app.js: runtime inline style mutation')
          if re.search(r'''@import\s+|url\(\s*["']?https?://''', css, re.I):
              failures.append('styles.css: remote stylesheet dependency')
          if '<link id="appStyles" rel="stylesheet" href="./styles.css" />' not in html:
              failures.append('index.html: external application stylesheet missing')
          if "script-src 'self' 'wasm-unsafe-eval'" not in html:
              failures.append('index.html: hardened script-src CSP missing')
          if "style-src 'self'; style-src-elem 'self'; style-src-attr 'none';" not in html:
              failures.append('index.html: strict style CSP missing')
          if '<script src="./whispercpp/runtime.js"></script>' not in html:
              failures.append('index.html: whisper.cpp adapter missing')
          if 'coi-serviceworker.js' in html:
              failures.append('index.html: obsolete COOP/COEP service worker still referenced')
          if 'WhisperCppRuntime' not in app:
              failures.append('app.js: whisper.cpp runtime integration missing')
          if 'params.n_threads = 1;' not in cpp:
              failures.append('whispercpp: single-thread inference is not enforced')
          if 'USE_PTHREADS' in cmake:
              failures.append('whispercpp: pthread build flag is still enabled')
          if "MODULARIZE=1" not in cmake or "ENVIRONMENT='worker'" not in cmake:
              failures.append('whispercpp: dedicated-worker WASM build flags missing')
          if '@huggingface/transformers' in (pkg.get('dependencies') or {}):
              failures.append('package.json: unused Transformers.js dependency remains')

          required = [
              Path('whispercpp/whisper.js'),
              Path('whispercpp/ggml-tiny-q5_1.bin'),
              Path('whispercpp/UPSTREAM_REVISION'),
              Path('whispercpp/MODEL_SHA256'),
              Path('whispercpp/RUNTIME_SHA256'),
              Path('vendor/SHA256SUMS'),
              Path('DEPENDENCY_LOCK_SHA256'),
              Path('styles.css'),
          ]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  failures.append(f'missing build artifact: {path}')

          if failures:
              print('Runtime dependency gate failed:')
              for item in failures:
                  print(' -', item)
              sys.exit(1)
          print('Runtime dependency gate passed.')
          PY

      - name: Install Chromium for production regression gate
        run: npx playwright install --with-deps chromium

      - name: Run production browser regression gate
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
        run: npm run test:e2e

      - name: Assemble minimal production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/vendor dist/whispercpp dist/assets/aok-pg24

          cp index.html app.js prescribers.js frame-guard.js styles.css prescribers.css brand-logo.jpg .nojekyll dist/
          cp -a vendor/. dist/vendor/
          cp whispercpp/runtime.js whispercpp/worker.js whispercpp/whisper.js whispercpp/ggml-tiny-q5_1.bin dist/whispercpp/
          cp -a assets/aok-pg24/. dist/assets/aok-pg24/

          required=(
            dist/index.html
            dist/app.js
            dist/frame-guard.js
            dist/styles.css
            dist/brand-logo.jpg
            dist/vendor/supabase.js
            dist/vendor/tesseract/tesseract.esm.min.js
            dist/vendor/pdfjs/pdf.min.mjs
            dist/whispercpp/runtime.js
            dist/whispercpp/worker.js
            dist/whispercpp/whisper.js
            dist/whispercpp/ggml-tiny-q5_1.bin
            dist/assets/aok-pg24/anlage-4-profilerhebungsbogen.pdf
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing production artifact: $file"; exit 1; }; done
          test -e dist/.nojekyll || { echo "Missing production artifact: dist/.nojekyll"; exit 1; }

          forbidden=(dist/.github dist/docs dist/tests dist/projektportal dist/supabase dist/package.json dist/package-lock.json dist/playwright.config.cjs)
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden development artifact in production bundle: $path"
              exit 1
            fi
          done

          if grep -RniE 'service[_-]?role|sb_secret_|/mnt/data|file://|localhost|127\.0\.0\.1' dist/index.html dist/app.js dist/frame-guard.js dist/whispercpp; then
            echo 'Production artifact safety gate failed.'
            exit 1
          fi

          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
          } > dist/BUILD_INFO.txt

          (
            cd dist
            find . -type f ! -name RELEASE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > RELEASE_SHA256SUMS
            sha256sum -c RELEASE_SHA256SUMS
          )

          test -s dist/BUILD_INFO.txt
          test -s dist/RELEASE_SHA256SUMS
          find dist -maxdepth 3 -type f -printf '%P\n' | sort
          du -sh dist

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
