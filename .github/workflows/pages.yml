name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Production safety gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.html' --include='*.js' --include='*.mjs' --include='*.json' --exclude-dir='.git' 'service[_-]?role|sb_secret_|/mnt/data|file://|localhost|127\.0\.0\.1' .; then
            echo 'Production safety gate failed: secret-like credential or local-only dependency found.'
            exit 1
          fi
          if ! grep -q 'sb_publishable_' index.html app.js; then
            echo 'Production safety gate failed: expected Supabase publishable key marker not found.'
            exit 1
          fi
          echo 'Production safety gate passed.'


      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Fetch current AOK PG24 source forms
        shell: bash
        run: |
          set -e
          mkdir -p assets/aok-pg24
          python3 - <<'PY'
          import html, os, re, urllib.parse, urllib.request
          page='https://www.aok.de/gp/orthopaedie-rehatechnik/vertraege/pg24-beinprothesen'
          req=urllib.request.Request(page+'?stand=20260901',headers={'User-Agent':'Mozilla/5.0'})
          try:
              raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          except Exception as e:
              print('AOK page fetch failed:',e); raise SystemExit(0)
          anchors=re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S)
          wanted={
            'Anlage 4':'anlage-4-profilerhebungsbogen.pdf',
            'Anlage 5a':'anlage-5a-fuss.pdf',
            'Anlage 5b':'anlage-5b-ukb.pdf',
            'Anlage 5c':'anlage-5c-knieex.pdf',
            'Anlage 5d':'anlage-5d-okb.pdf',
            'Anlage 5e':'anlage-5e-hueftex.pdf',
          }
          found={}
          for href,labelhtml in anchors:
              label=html.unescape(re.sub('<[^>]+>',' ',labelhtml))
              label=' '.join(label.split())
              for needle,target in wanted.items():
                  if needle.lower() in label.lower() and target not in found:
                      url=urllib.parse.urljoin(page,html.unescape(href))
                      if '.pdf' in url.lower():
                          found[target]=url
          print('AOK PG24 assets found:',sorted(found))
          for target,url in found.items():
              try:
                  out=os.path.join('assets/aok-pg24',target)
                  r=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':page})
                  data=urllib.request.urlopen(r,timeout=60).read()
                  if data[:4]==b'%PDF':
                      open(out,'wb').write(data)
                      print('downloaded',target,len(data))
              except Exception as e:
                  print('download failed',target,e)
          PY

      - name: Setup pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build locked browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor models node_modules
          mkdir -p vendor/tesseract/core vendor/tesseract/lang vendor/pdfjs vendor/transformers
          mkdir -p models/onnx-community/whisper-tiny/onnx

          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=critical

          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js vendor/supabase.js
          cp node_modules/tesseract.js/dist/tesseract.esm.min.js vendor/tesseract/tesseract.esm.min.js
          cp node_modules/tesseract.js/dist/worker.min.js vendor/tesseract/worker.min.js
          cp node_modules/tesseract.js-core/tesseract-core* vendor/tesseract/core/

          LANG_FILE="$(find node_modules/@tesseract.js-data/deu -type f -name 'deu.traineddata.gz' -print -quit)"
          test -n "$LANG_FILE"
          cp "$LANG_FILE" vendor/tesseract/lang/deu.traineddata.gz

          cp node_modules/pdfjs-dist/build/pdf.min.mjs vendor/pdfjs/pdf.min.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs vendor/pdfjs/pdf.worker.min.mjs

          cp node_modules/@huggingface/transformers/dist/transformers.min.js vendor/transformers/transformers.min.js
          find node_modules/@huggingface/transformers/dist -maxdepth 1 -type f -name 'ort-*' -exec cp {} vendor/transformers/ \;

          test -s vendor/supabase.js
          test -s vendor/tesseract/tesseract.esm.min.js
          test -s vendor/tesseract/worker.min.js
          test -s vendor/tesseract/lang/deu.traineddata.gz
          test -s vendor/pdfjs/pdf.min.mjs
          test -s vendor/pdfjs/pdf.worker.min.mjs
          test -s vendor/transformers/transformers.min.js

          rm -rf node_modules

      - name: Fetch pinned Whisper model for same-origin runtime
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="models/onnx-community/whisper-tiny"
          REV="ff4177021cc41f7db950912b73ea4fdf7d01d8e7"
          BASE="https://huggingface.co/onnx-community/whisper-tiny/resolve/$REV"

          files=(
            "added_tokens.json"
            "config.json"
            "generation_config.json"
            "merges.txt"
            "normalizer.json"
            "preprocessor_config.json"
            "quantize_config.json"
            "special_tokens_map.json"
            "tokenizer.json"
            "tokenizer_config.json"
            "vocab.json"
            "onnx/encoder_model_quantized.onnx"
            "onnx/decoder_model_merged_quantized.onnx"
          )

          for file in "${files[@]}"; do
            mkdir -p "$MODEL_DIR/$(dirname "$file")"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              "$BASE/$file?download=true" \
              --output "$MODEL_DIR/$file"
            test -s "$MODEL_DIR/$file"
          done

          echo "2af4a414ca47aa30f61246017e5fe82b0a8d229281d1255ba666a2a7f6b84d19  $MODEL_DIR/onnx/encoder_model_quantized.onnx" | sha256sum -c -
          echo "25e807a962b6349356d0ea5d0dfe530b7e5bf0e2a484aeca0359d03143faddd3  $MODEL_DIR/onnx/decoder_model_merged_quantized.onnx" | sha256sum -c -

          printf '%s\n' "$REV" > "$MODEL_DIR/UPSTREAM_REVISION"
          find "$MODEL_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$MODEL_DIR/SHA256SUMS"
          find vendor -type f -print0 | sort -z | xargs -0 sha256sum > vendor/SHA256SUMS
          sha256sum package-lock.json > DEPENDENCY_LOCK_SHA256
      - name: Runtime dependency gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          files = [Path('index.html'), Path('app.js')]
          checks = [
              ('remote dynamic import', re.compile(r'''import\s*\(\s*["']https://''', re.I)),
              ('remote static import', re.compile(r'''from\s*["']https://''', re.I)),
              ('remote script source', re.compile(r'''<script\b[^>]*\bsrc\s*=\s*["']https://''', re.I)),
          ]
          failures = []
          for path in files:
              source = path.read_text(encoding='utf-8')
              for label, pattern in checks:
                  if pattern.search(source):
                      failures.append(f'{path}: {label}')

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')

          if re.search(r'''<script\b(?![^>]*\bsrc\s*=)[^>]*>''', html, re.I):
              failures.append('index.html: inline script block')
          if re.search(r'<style\b', html, re.I):
              failures.append('index.html: inline style block')
          if re.search(r'\sstyle\s*=', html, re.I):
              failures.append('index.html: inline style attribute')
          if re.search(r'''\.style\b|setAttribute\(\s*["']style["']|cssText''', app):
              failures.append('app.js: runtime inline style mutation')
          if re.search(r'''@import\s+|url\(\s*["']?https?://''', css, re.I):
              failures.append('styles.css: remote stylesheet dependency')
          if '<link id="appStyles" rel="stylesheet" href="./styles.css" />' not in html:
              failures.append('index.html: external application stylesheet missing')
          if "script-src 'self' 'wasm-unsafe-eval'" not in html:
              failures.append('index.html: hardened script-src CSP missing')
          if "style-src 'self'; style-src-elem 'self'; style-src-attr 'none';" not in html:
              failures.append('index.html: strict style CSP missing')
          if 'huggingface.co' in html.lower() or 'hf.co' in html.lower():
              failures.append('index.html: runtime Hugging Face network access still allowed')
          if 'allowRemoteModels=false' not in app:
              failures.append('app.js: Transformers remote models are not disabled')
          if "localModelPath=new URL('./models/',import.meta.url).href" not in app:
              failures.append('app.js: local model path missing')
          if "dtype:{encoder_model:'q8',decoder_model_merged:'q8'}" not in app:
              failures.append('app.js: Whisper dtype is not pinned')

          required = [
              Path('models/onnx-community/whisper-tiny/onnx/encoder_model_quantized.onnx'),
              Path('models/onnx-community/whisper-tiny/onnx/decoder_model_merged_quantized.onnx'),
              Path('models/onnx-community/whisper-tiny/UPSTREAM_REVISION'),
              Path('vendor/SHA256SUMS'),
              Path('DEPENDENCY_LOCK_SHA256'),
              Path('styles.css'),
          ]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  failures.append(f'missing build artifact: {path}')

          if failures:
              print('Runtime dependency gate failed:')
              for item in failures:
                  print(' -', item)
              sys.exit(1)
          print('Runtime dependency gate passed.')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
